<!DOCTYPE html>
<html>
<head>
    <title>Quiz</title>
</head>
<body>
    <h1>Quick Quiz</h1>
    <form>
        {% for q in questions %}
            <p><b>{{ q['question'] }}</b></p>
            {% for opt in q['options'] %}
                <input type="radio" name="{{ q['id'] }}" value="{{ opt }}"> {{ opt }}<br>
            {% endfor %}
        {% endfor %}
        <button type="submit">Submit</button>
    </form>
</body>
</html>
